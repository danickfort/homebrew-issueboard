name: Homebrew installation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - name: Install from the public tap
        run: brew install danickfort/issueboard/issueboard
      - name: Verify only issueboard is installed and test offline demos
        run: |
          prefix="$(brew --prefix issueboard)"
          test -x "$prefix/bin/issueboard"
          for removed in youtrack-board gitlab-board jira-board; do
            test ! -e "$prefix/bin/$removed"
          done
          brew test danickfort/issueboard/issueboard
